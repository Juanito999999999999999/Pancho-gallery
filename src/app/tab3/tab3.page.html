<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Ranking
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Ranking</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-list>
    @for (p of ranking; track p.rank) {
      <ion-item>
        <ion-label>
          <h2>Rank {{ p.rank }} - {{ p.nombre }}</h2>
          <p>{{ p.objetos }} objetos encontrados - tiempo: {{ p.tiempo }}</p>
        </ion-label>
      </ion-item>
    }
  </ion-list>
</ion-content>
