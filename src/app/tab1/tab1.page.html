<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Inicio
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Inicio</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-item lines="none">
    <ion-avatar slot="start" [class.female]="jugador.sexo === 'F'">
      <img alt="Avatar" [src]="jugador.avatar" />
    </ion-avatar>

    <ion-label>
      <h2>
        <ion-text color="medium">Nombre:</ion-text>
        {{ jugador.nombre }}
      </h2>
      <p>
        <ion-text color="medium">Edad:</ion-text>
        {{ jugador.edad }}
      </p>

    </ion-label>

  </ion-item>
  <ion-item>
    <ion-label class="ion-text-center">Desafíos Disponibles</ion-label>
  </ion-item>

  <ion-item>
    <ion-grid class="ion-text-center">
      <ion-row class="grid-header ion-align-items-center">
        <ion-col size="3" class="ion-text-center">N°</ion-col>
        <ion-col size="auto" class="ion-text-center">Imagen</ion-col>
        <ion-col size="5" class="ion-text-center">Desafío</ion-col>
        <ion-col size="auto" class="ion-text-center">Acción</ion-col>
      </ion-row>

      @for (desafio of desafios; track $index; let i = $index) {
      <ion-row class="challenge-row ion-align-items-center">
        <ion-col size="3" class="num ion-text-center">Desafio: {{ i + 1 }}</ion-col>
        <ion-col size="auto">
          <ion-img [src]="desafio.icono"></ion-img>
        </ion-col>
        <ion-col size="5">{{ desafio.desafio }}</ion-col>
        <ion-col size="auto" class="ion-text-center">
          <ion-button fill="clear">Jugar</ion-button>
        </ion-col>
      </ion-row>
      }
    </ion-grid>
  </ion-item>

</ion-content>
